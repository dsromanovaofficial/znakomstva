.iconbox {
  --iconbox-size:      48px;
  --iconbox-icon-size: 24px;
  --iconbox-radius:    var(--radius-m);
  --iconbox-bg:        var(--btn-secondary-bg);   
  --iconbox-fg:        var(--fg-primary);

  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width:  var(--iconbox-size);
  height: var(--iconbox-size);
  min-width: var(--iconbox-size);
  border-radius: var(--iconbox-radius);
  background: var(--iconbox-bg);
  color: var(--iconbox-fg);
  
  font-size: 0;
  line-height: 0;
  
  overflow: visible;
  
  --inline-icon-height: var(--iconbox-icon-size);
  --icon-shift: 0; 
}
.iconbox > svg,
.iconbox > img {
  display: block;
  width:  var(--iconbox-icon-size);
  height: var(--iconbox-icon-size);
}

  width: auto;
  
  color: inherit;
